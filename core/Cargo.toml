[package]
name = "polaroid_core"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.38.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.polars-plan]
version = "=0.55.2"
default-features = false
features = ["dsl-schema"]

[dependencies.polars]
version = "=0.55.2"
default-features = false
features = [
    "abs",
    "coalesce",
    "csv",
    "cum_agg",
    "cross_join",
    "dtype-full",
    "fmt",
    "is_between",
    "is_in",
    "lazy",
    "list_eval",
    "parquet",
    "pivot",
    "range",
    "regex",
    "repeat_by",
    "replace",
    "round_series",
    "serde-lazy",
    "streaming",
    "strings",
    "temporal",
    "timezones",
]
