[package]
name = "polaroid_core"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies.polars-async]
version = "=0.55.2"

[dependencies.polars-plan]
version = "=0.55.2"
default-features = false
features = ["dsl-schema"]

[dependencies.polars]
version = "=0.55.2"
default-features = false
features = [
    "abs",
    "approx_unique",
    "arg_where",
    "array_arithmetic",
    "array_count",
    "array_to_struct",
    "binary_encoding",
    "bitwise",
    "business",
    "coalesce",
    "concat_str",
    "cov",
    "cross_join",
    "cse",
    "cum_agg",
    "cumulative_eval",
    "cutqcut",
    "diagonal_concat",
    "diff",
    "dot_product",
    "dtype-full",
    "ewma",
    "ewma_by",
    "extract_groups",
    "extract_jsonpath",
    "find_many",
    "fmt",
    "fused",
    "hist",
    "index_of",
    "interpolate",
    "interpolate_by",
    "ipc",
    "is_between",
    "is_close",
    "is_first_distinct",
    "is_in",
    "is_last_distinct",
    "is_unique",
    "json",
    "lazy",
    "list_arithmetic",
    "list_count",
    "list_drop_nulls",
    "list_eval",
    "list_filter",
    "list_gather",
    "list_sample",
    "list_sets",
    "list_to_struct",
    "log",
    "mode",
    "moment",
    "month_end",
    "month_start",
    "offset_by",
    "parquet",
    "pct_change",
    "peaks",
    "pivot",
    "product",
    "propagate_nans",
    "random",
    "range",
    "rank",
    "regex",
    "reinterpret",
    "repeat_by",
    "replace",
    "rle",
    "rolling_window",
    "rolling_window_by",
    "round_series",
    "row_hash",
    "search_sorted",
    "semi_anti_join",
    "serde-lazy",
    "sign",
    "streaming",
    "string_encoding",
    "string_normalize",
    "string_pad",
    "string_reverse",
    "string_to_integer",
    "strings",
    "temporal",
    "timezones",
