[workspace]
members = ["core", "iced"]

[workspace.dependencies]
iced = { git = "https://github.com/iced-rs/iced", branch = "master" }
iced_test = { git = "https://github.com/iced-rs/iced", branch = "master" }

[package]
name = "polaroid"
version = "0.1.0"
edition = "2024"
authors = ["Travis Hammond <dashdeckers@gmail.com>"]
repository = "https://github.com/dashdeckers/polaroid"
homepage = "https://github.com/dashdeckers/polaroid"
description = "An abstraction and GUI over Polars."
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "iced",
    "polars",
    "gui",
    "data",
    "visualization",
]

[features]
gui = ["dep:iced", "dep:polaroid_iced", "dep:rfd", "dep:tokio"]

[dependencies]
fern = "0.7.1"
iced = { workspace = true, features = ["advanced", "canvas", "tokio"], optional = true }
log = "0.4"
polaroid_core = { path = "core" }
polaroid_iced = { path = "iced", optional = true }
rfd = { version = "0.18.0", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process"], optional = true }

[dev-dependencies]
iced_test = { workspace = true }
schemars = "1.2"
