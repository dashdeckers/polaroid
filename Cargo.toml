[workspace]
members = ["core"]

[package]
name = "polaroid"
version = "0.1.0"
edition = "2024"
authors = ["Travis Hammond <dashdeckers@gmail.com>"]
repository = "https://github.com/dashdeckers/polaroid"
homepage = "https://github.com/dashdeckers/polaroid"
description = "An abstraction and GUI over Polars."
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "iced",
    "polars",
    "gui",
    "data",
    "visualization",
]

[dependencies]
fern = "0.7.1"
log = "0.4"
polaroid_core = { path = "core" }
serde_json = "1"
