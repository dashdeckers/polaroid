[package]
name = "polaroid"
version = "0.1.0"
edition = "2024"
authors = ["Travis Hammond <dashdeckers@gmail.com>"]
repository = "https://github.com/dashdeckers/polaroid"
homepage = "https://github.com/dashdeckers/polaroid"
description = "A pipeline abstraction and GUI over Polars."
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "iced",
    "polars",
    "gui",
    "data",
    "plot",
]

[features]
gui = ["dep:iced", "dep:tokio"]

[dependencies]
# workspace crates
polaroid_core = { path = "core" }
# telemetry
fern = "0.7.1"
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["canvas", "tokio"], optional = true }
log = "0.4"
# serialization
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process"], optional = true }

[dev-dependencies]
iced_test = { git = "https://github.com/iced-rs/iced", branch = "master" }
schemars = "1.2"

[workspace]
members = [
    "core",
]

[workspace.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
