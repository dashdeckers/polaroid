[package]
name = "polaroid"
version = "0.1.0"
edition = "2024"
authors = ["Travis Hammond <dashdeckers@gmail.com>"]
repository = "https://github.com/dashdeckers/polaroid"
homepage = "https://github.com/dashdeckers/polaroid"
description = "A pipeline abstraction and GUI over Polars."
license-file = "LICENSE"
readme = "README.md"
keywords = [
    "iced",
    "polars",
    "gui",
    "data",
    "plot",
]

[dependencies]
# workspace crates
polaroid_core = { path = "core" }
polaroid_iced = { optional = true, path = "iced" }
# telemetry
fern = "0.7.1"
log = "0.4"
# serialization
serde_json = "1"
# gui (iced)
iced = { optional = true, workspace = true, features = [
    "advanced",
    "canvas",
    "fira-sans",
    "image-without-codecs",
    "markdown",
    "svg",
    "tokio",
] }
# the codec of the images that a plot draws
image = { optional = true, version = "0.25", default-features = false, features = ["png"] }
tokio = { optional = true, version = "1", features = [
    "io-util",
    "process",
    "time",
] }
rfd = { optional = true, version = "0.18.0" }
# the plot that is zoomed and panned, where a build has both the gui and plots
rustd3-iced = { optional = true, workspace = true }

[features]
plot = [
    "polaroid_core/plot",
    "rustd3-iced?/figure",
]
gui = [
    "dep:iced",
    "dep:image",
    "dep:polaroid_iced",
    "dep:rfd",
    "dep:rustd3-iced",
    "dep:tokio",
]

[dev-dependencies]
iced_test = { workspace = true }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }

# optimize for fast compilation
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# optimize for fast runtime
[profile.release]
codegen-units = 1
lto = "thin"

[workspace]
members = [
    "core",
    "iced",
]

[workspace.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
rustd3-core = { git = "https://github.com/dashdeckers/rustd3", rev = "5edef322597a2a63bd87640b1c39a0279fa77f91" }
rustd3-figure = { git = "https://github.com/dashdeckers/rustd3", rev = "5edef322597a2a63bd87640b1c39a0279fa77f91" }
rustd3-fonts = { git = "https://github.com/dashdeckers/rustd3", rev = "5edef322597a2a63bd87640b1c39a0279fa77f91" }
rustd3-iced = { git = "https://github.com/dashdeckers/rustd3", rev = "5edef322597a2a63bd87640b1c39a0279fa77f91" }
